[package]
name = "voidsweep"
version = "0.1.0"
edition = "2021"
description = "GUI sweeper for _DELETE_ prefixed files left by The Void Weaver agents"
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.29"
egui_extras = "0.29"
walkdir = "2.5"
humansize = "2.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
trash = "5"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
dirs = "5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
